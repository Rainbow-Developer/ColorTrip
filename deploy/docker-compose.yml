# ColorTrip 운영 인스턴스(Compute Engine)용 Docker Compose
# 현재는 BE 중심: Caddy(TLS) + Cloud SQL Auth Proxy + FastAPI.
# FE(Flutter Web)는 frontend 빌드 산출물을 Caddy가 서빙하도록 후속 추가한다.
services:
  cloudsql-proxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:latest # TODO: 운영 전 특정 버전으로 핀
    command:
      - "--address=0.0.0.0"
      - "--port=5432"
      - "${CLOUD_SQL_CONNECTION_NAME}"
    restart: unless-stopped
    # 인스턴스에 부착된 서비스 계정(roles/cloudsql.client)으로 인증 — 키 파일 불필요

  api:
    image: ${API_IMAGE}
    env_file: .env
    depends_on:
      - cloudsql-proxy
    restart: unless-stopped
    # 호스트 포트를 열지 않는다. 외부 노출은 caddy 가 전담하고 api 는 내부망으로만 접근된다
    # (평문으로 API 에 직접 닿는 우회 경로 제거). 근거: docs/specs/065-dev-https/plan.md
    expose:
      - "8000"

  caddy:
    # 이동 가능한 태그(2-alpine)를 쓰면 재배포마다 다른 패치 이미지를 받을 수 있어
    # 검증한 버전을 digest 로 고정한다. 업그레이드는 의도적으로만 한다.
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    depends_on:
      - api
    restart: unless-stopped
    environment:
      # Caddyfile 의 {$API_DOMAIN} 치환값. deploy.sh 가 .env 에 기록한다.
      API_DOMAIN: ${API_DOMAIN}
    ports:
      - "80:80"   # ACME HTTP-01 챌린지 + HTTPS 리다이렉트
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 인증서·ACME 계정 키 영속화. 이게 없으면 배포마다 재발급해 Let's Encrypt
      # rate limit 에 걸린다.
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
