# PostgreSQL for backend tests.
services:
  test-db:
    image: postgres:17
    environment:
      POSTGRES_USER: colortrip
      POSTGRES_PASSWORD: colortrip
      POSTGRES_DB: colortrip_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U colortrip -d colortrip_test"]
      interval: 5s
      timeout: 3s
      retries: 10
