# 로컬 개발 환경 (docs/conventions/infra-deploy.md: Docker Compose PostgreSQL + FastAPI)
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: colortrip
      POSTGRES_PASSWORD: colortrip
      POSTGRES_DB: colortrip
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U colortrip"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    environment:
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: postgresql+asyncpg://colortrip:colortrip@db:5432/colortrip
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required. Copy .env.example to .env for local dev.}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-14}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:-http://127.0.0.1:8000/dev/kakao/callback}
      KAKAO_AUTHORIZE_URL: ${KAKAO_AUTHORIZE_URL:-https://kauth.kakao.com/oauth/authorize}
      KAKAO_TOKEN_URL: ${KAKAO_TOKEN_URL:-https://kauth.kakao.com/oauth/token}
      KAKAO_USER_INFO_URL: ${KAKAO_USER_INFO_URL:-https://kapi.kakao.com/v2/user/me}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      ENABLE_DEV_AUTH_ROUTES: ${ENABLE_DEV_AUTH_ROUTES:-false}
      TOUR_API_KEY: ${TOUR_API_KEY:-}
      TOUR_API_BASE_URL: ${TOUR_API_BASE_URL:-https://apis.data.go.kr/B551011/KorService2}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
